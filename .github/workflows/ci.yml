name: ci

on:
  pull_request:
    branches:
      - nrs-master
      - master
  push:
    branches:
      - nrs-master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Acceptance tests self-skip unless TF_ACC is set, so this runs the unit
      # tests only and never touches a live JumpCloud tenant.
      - name: Test
        run: go test ./...
