name: release
on:
  push:
    tags:
      - 'v*'
  # Lets a release be re-run after a transient failure without deleting and
  # re-pushing the tag.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # GoReleaser needs the full history and all tags to resolve the version
          # and build the changelog; the default shallow fetch breaks both.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth, so the release build can't drift from go.mod.
          go-version-file: go.mod

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      
      - name: Clean dist directory
        run: rm -rf dist/
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          # "latest" resolves to the newest GoReleaser v2, which matches the
          # `version: 2` declared in .goreleaser.yml.
          version: latest
          args: release
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
